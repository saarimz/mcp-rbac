# CI for mcp-rbac: lint, tests (TS on SDK v1 + v2, Python, Go, Rust), cross-engine conformance, docs, red team.
# Everything runs from public registries; no secrets are used.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: npm ci --no-audit --no-fund
      - name: TypeScript typecheck
        run: npx tsc --noEmit -p .
      # rustfmt is not enforced: the core uses a denser style than the rustfmt default
      - name: Rust clippy
        working-directory: core
        run: cargo clippy --release --all-targets --all-features -- -D warnings
      - name: Go fmt + vet
        working-directory: go
        run: |
          ./build-wasm.sh
          test -z "$(gofmt -l .)"
          go vet ./...
      - name: Python mypy (strict)
        run: |
          python -m pip install --upgrade pip maturin
          # the PyO3 core first: python/ pins mcp-rbac-core==<version>, built here rather than fetched from PyPI
          (cd core/mcp-rbac-py && maturin build --release -o ../../dist-py && python -m pip install ../../dist-py/*.whl)
          python -m pip install -e "python[dev]"
          (cd python && mypy src)
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  ts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        mode: [default, hop]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install wasm-pack
        run: cargo install --locked wasm-pack
      - run: npm ci --no-audit --no-fund
      - run: npm run build:wasm
      - run: npm run build
      - name: Python venv for the cross-language tests
        run: |
          python -m venv python/.venv
          python/.venv/bin/pip install maturin
          (cd core/mcp-rbac-py && VIRTUAL_ENV="$GITHUB_WORKSPACE/python/.venv" ../../python/.venv/bin/maturin develop --release)
          python/.venv/bin/pip install -e "python[dev]"
      - name: vitest (SDK v1 1.32 and SDK v2 2.4 are both exercised; mode=hop runs v1 servers through the 0.4 hop)
        env:
          MCP_RBAC_TEST_HOP: ${{ matrix.mode == 'hop' && '1' || '' }}
        run: npx vitest run

  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: Install the package and the PyO3 core
        run: |
          python -m venv python/.venv
          python/.venv/bin/pip install maturin
          (cd core/mcp-rbac-py && VIRTUAL_ENV="$GITHUB_WORKSPACE/python/.venv" ../../python/.venv/bin/maturin develop --release)
          python/.venv/bin/pip install -e "python[dev]"
      - name: pytest
        working-directory: python
        run: .venv/bin/python -m pytest -q -rs

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Build the embedded core and test
        working-directory: go
        run: |
          ./build-wasm.sh
          go test -race -count=1 ./...
          cd examples/devops && go test -race -count=1 ./...

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - working-directory: core
        run: cargo test --release --all-features

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install wasm-pack
        run: cargo install --locked wasm-pack
      - name: Bootstrap (npm, Python venv, PyO3 + WASM cores)
        run: |
          pip install uv
          tools/bootstrap.sh
      - name: Six runners, byte-identical
        run: conformance/run.sh

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install wasm-pack
        run: cargo install --locked wasm-pack
      - name: Bootstrap
        run: |
          pip install uv
          tools/bootstrap.sh
      - name: Snippets run and match, links and anchors resolve, packs identical in TS/Python/Go
        run: tools/docs-check.sh

  redteam:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install wasm-pack
        run: cargo install --locked wasm-pack
      - name: Bootstrap
        run: |
          pip install uv
          tools/bootstrap.sh
      - name: 140-check red team over the three example servers (stdio + HTTP)
        run: |
          python/.venv/bin/python -m redteam.run
          python3 -c "import json,sys; s=json.load(open('redteam/report.json'))['checks']; bad=[c for c in s if not c.get('ok')]; print(len(s), 'checks,', len(bad), 'failed'); sys.exit(1 if bad else 0)"

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install wasm-pack
        run: cargo install --locked wasm-pack
      - run: npm ci --no-audit --no-fund
      - run: npm run build:wasm
      - name: Package dry runs (npm, PyPI, crates.io) + install the tarballs in a clean project
        run: tools/release-dry-run.sh
