# Release: npm `mcp-rbac`, PyPI `mcp-rbac` + `mcp-rbac-core` (PyO3 wheels), crates.io `mcp-rbac-core`.
#
# Every registry uses trusted publishing (OIDC, no long-lived tokens). One-time setup, by the owner, before the
# first real run (see docs/RELEASING.md): create the GitHub environments `npm`, `pypi` and `crates` with required
# reviewers, and register this workflow file (release.yml) as the trusted publisher on each registry.
#
# Gates, in order: the full CI (ci.yml, reused) -> versions agree everywhere -> tools/release-dry-run.sh (builds,
# checks and installs every artifact) -> builds -> publishes in dependency order: crates.io mcp-rbac-core ->
# PyPI mcp-rbac-core -> PyPI mcp-rbac (pins the core) -> npm mcp-rbac. A failure stops every later registry, and a
# re-run skips versions that are already on a registry, so a partial release can be completed by re-running.
#
# Dry run (default for manual runs): everything up to the uploads, plus `npm publish --dry-run` and
# `cargo publish --dry-run`. A real publish needs a pushed `v*` tag (a manual run with dry_run=false must also be on
# a `v*` tag ref), plus an approval on each environment.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check everything, publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  check-version:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - id: v
        name: Versions agree (manifests, core pin, __version__, instrumentation constants, tag)
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then tools/check-versions.sh --tag "$GITHUB_REF_NAME"; else tools/check-versions.sh; fi
          if [ "$DRY_RUN" != "true" ] && [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "a real publish runs only from a v* tag (this run is on $GITHUB_REF_TYPE $GITHUB_REF_NAME)"; exit 1
          fi
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  dry-run:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - run: cargo install --locked wasm-pack
      - run: npm ci --no-audit --no-fund
      - run: npm run build:wasm
      - name: Build, check and install every artifact (uploads nothing)
        run: tools/release-dry-run.sh

  npm-build:
    needs: dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - run: cargo install --locked wasm-pack
      - run: npm ci --no-audit --no-fund
      - run: npm pack # prepack builds the WASM core and the TypeScript
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: npm
          path: mcp-rbac-*.tgz

  py-core-wheels:
    needs: dry-run
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: macos-latest, target: aarch64 }
          - { os: macos-15-intel, target: x86_64 }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: core/mcp-rbac-py
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || '' }}
          args: --release --out dist
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: py-core-${{ matrix.os }}-${{ matrix.target }}
          path: core/mcp-rbac-py/dist/*.whl

  py-core-sdist:
    needs: dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: core/mcp-rbac-py
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: py-core-sdist
          path: core/mcp-rbac-py/dist/*.tar.gz

  py-build:
    needs: dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build python --outdir dist-py
      - run: python -m twine check --strict dist-py/*
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: py
          path: dist-py/*

  # 1. crates.io mcp-rbac-core
  crates-publish:
    needs: [check-version, npm-build, py-core-wheels, py-core-sdist, py-build] # every artifact built before anything uploads
    runs-on: ubuntu-latest
    environment: crates
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: cargo publish --dry-run
        working-directory: core
        run: cargo publish --dry-run -p mcp-rbac-core
      - id: exists
        name: Already on crates.io? (a re-run completes a partial release)
        env:
          V: ${{ needs.check-version.outputs.version }}
        run: |
          if curl -fsS -A "mcp-rbac-release (github actions)" "https://crates.io/api/v1/crates/mcp-rbac-core/$V" >/dev/null 2>&1; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        if: env.DRY_RUN != 'true' && steps.exists.outputs.skip != 'true'
        id: auth
      - name: cargo publish
        if: env.DRY_RUN != 'true' && steps.exists.outputs.skip != 'true'
        working-directory: core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p mcp-rbac-core

  # 2. PyPI mcp-rbac-core (wheels + sdist)
  pypi-core-publish:
    needs: crates-publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing (PEP 740 attestations are generated by the action)
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: py-core-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - name: Check (dry run stops here)
        run: |
          python -m pip install twine
          python -m twine check --strict dist/*
      - name: Publish mcp-rbac-core
        if: env.DRY_RUN != 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist
          skip-existing: true

  # 3. PyPI mcp-rbac (pins mcp-rbac-core==<version>, which now exists)
  pypi-publish:
    needs: pypi-core-publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: py
          path: dist
      - run: ls -l dist
      - name: Check (dry run stops here)
        run: |
          python -m pip install twine
          python -m twine check --strict dist/*
      - name: Publish mcp-rbac
        if: env.DRY_RUN != 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist
          skip-existing: true

  # 4. npm mcp-rbac
  npm-publish:
    needs: [check-version, pypi-publish]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # trusted publishing; npm adds the provenance attestation itself
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm >= 11.5.1 (trusted publishing)
        run: npm install -g npm@^11.5.1
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: npm
      - name: Publish (skipped when this version is already on npm, e.g. the hand-published first version)
        env:
          V: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          tgz=$(ls mcp-rbac-*.tgz)
          if [ "$DRY_RUN" = "true" ]; then npm publish --dry-run --access public "$tgz"; exit 0; fi
          if [ "$(npm view "mcp-rbac@$V" version 2>/dev/null || true)" = "$V" ]; then echo "mcp-rbac@$V is already on npm"; exit 0; fi
          npm publish --access public "$tgz"
