[package]
name = "mcp-rbac-core"
description = "Deterministic, side-effect-free decision core for mcp-rbac portable policies (mcp-rbac.yaml v1)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository = "https://github.com/saarimz/mcp-rbac"
homepage = "https://github.com/saarimz/mcp-rbac"
documentation = "https://docs.rs/mcp-rbac-core"
readme = "README.md"
keywords = ["mcp", "rbac", "authorization", "policy", "ai-agents"]
categories = ["authentication", "config", "wasm"]
include = ["src/**/*.rs", "examples/readme.rs", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
indexmap = "2"
regex = "1"
yaml-rust2 = { version = "0.13", default-features = false }
sha2 = "0.10"
ryu-js = "1"

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
