[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "mcp-rbac-core"
version = "0.5.0"
description = "Rust decision core for mcp-rbac policies (PyO3 build of the mcp-rbac-core crate); used by the mcp-rbac package"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Saarim Zaman" }]
keywords = ["mcp", "rbac", "authorization", "policy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/mcp-rbac/mcp-rbac"
Issues = "https://github.com/mcp-rbac/mcp-rbac/issues"

[tool.maturin]
module-name = "mcp_rbac_core._native"
python-source = "python"
