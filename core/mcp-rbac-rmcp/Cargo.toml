[package]
name = "mcp-rbac-rmcp"
description = "mcp-rbac guard for the official Rust MCP SDK (rmcp): a Service<RoleServer> decorator over mcp-rbac-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.88"
publish = false

[dependencies]
mcp-rbac-core = { path = "../mcp-rbac-core" }
rmcp = { version = "=3.10.0", default-features = false, features = ["server", "macros", "transport-io"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
schemars = "1"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
opentelemetry = { version = "=0.33.1", default-features = false, features = ["trace", "metrics", "logs"], optional = true }
tracing = { version = "0.1", optional = true }
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["trace", "metrics", "logs", "rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics", "logs"], optional = true }

[features]
default = []
otel = ["dep:opentelemetry", "dep:tracing"]
# OTLP/HTTP export for the bundled mini-server (examples/tests only; the library itself never picks an exporter).
otlp = ["otel", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]

[dev-dependencies]
rmcp = { version = "=3.10.0", default-features = false, features = ["client", "transport-child-process"] }
opentelemetry_sdk = { version = "=0.33.1", features = ["testing", "trace", "metrics", "logs"] }
tokio = { version = "1", features = ["io-util"] }

[[test]]
name = "otel"
required-features = ["otel"]

[[test]]
name = "feedback"
required-features = ["otel"]
