[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-rbac"
version = "0.4.0"
description = "Authorization for Python MCP servers: typed roles, OAuth scopes, tenants, RFC 8693 delegation, approvals (MRTR), budgets, PII redaction, tamper-evident audit, AuthZEN 1.0."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["mcp>=2.3,<3", "httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
jwt = ["pyjwt[crypto]>=2.8"]
redis = ["redis>=5"]
postgres = ["psycopg[binary]>=3.1"]
pdp = ["uvicorn>=0.30", "starlette>=0.37"]
# OTLP/HTTP export (examples/core-servers/python/otlp.py, tools/otel-e2e.sh); the guard itself needs only opentelemetry-api/sdk
otlp = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]
dev = ["pytest>=8", "anyio>=4", "mypy>=1.10", "opentelemetry-sdk>=1.25", "pyjwt[crypto]>=2.8", "redis>=5", "psycopg[binary]>=3.1", "uvicorn>=0.30"]

[project.scripts]
mcp-rbac-py = "mcp_rbac.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcp_rbac = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true
