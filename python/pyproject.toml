[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-rbac"
version = "0.5.0"
description = "Authorization for Python MCP servers: one YAML policy decides which roles can call which tools, with argument limits, approvals bound to exact arguments, rate limits and a tamper-evident audit chain."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Saarim Zaman" }]
keywords = ["mcp", "model-context-protocol", "authorization", "rbac", "ai-agents", "policy", "audit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = ["mcp>=2.3,<3", "mcp-rbac-core==0.5.0", "httpx>=0.27", "pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/mcp-rbac/mcp-rbac"
Documentation = "https://github.com/mcp-rbac/mcp-rbac/blob/main/docs/python.md"
Issues = "https://github.com/mcp-rbac/mcp-rbac/issues"
Changelog = "https://github.com/mcp-rbac/mcp-rbac/blob/main/CHANGELOG.md"

[project.optional-dependencies]
jwt = ["pyjwt[crypto]>=2.8"]
redis = ["redis>=5"]
postgres = ["psycopg[binary]>=3.1"]
pdp = ["uvicorn>=0.30", "starlette>=0.37"]
# OTLP/HTTP export (examples/core-servers/python/otlp.py, tools/otel-e2e.sh); the guard itself needs only opentelemetry-api/sdk
otlp = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]
dev = ["pytest>=8", "anyio>=4", "mypy>=1.10", "opentelemetry-sdk>=1.25", "pyjwt[crypto]>=2.8", "redis>=5", "psycopg[binary]>=3.1", "uvicorn>=0.30"]

[project.scripts]
mcp-rbac-py = "mcp_rbac.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcp_rbac = ["py.typed", "packs_data/*/pack.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true
